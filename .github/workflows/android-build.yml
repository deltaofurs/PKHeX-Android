name: Build and Verify Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch pinned PKHeX
        run: ./setup-pkhex.sh

      - name: Show pinned upstream revision
        run: |
          echo "Pinned PKHeX: $(cat PKHEX_COMMIT.txt)"
          git -C PKHeX rev-parse HEAD

      - name: Restore platform-independent projects
        run: |
          dotnet restore ./PKHeX.Android.Core/PKHeX.Android.Core.csproj
          dotnet restore ./PKHeX.Android.SmokeTests/PKHeX.Android.SmokeTests.csproj

      - name: Run PKHeX Core smoke tests
        run: dotnet run --project ./PKHeX.Android.SmokeTests/PKHeX.Android.SmokeTests.csproj -c Release --no-restore

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore Android project
        run: dotnet restore ./PKHeX.Android/PKHeX.Android.csproj

      - name: Build Release APK
        run: dotnet publish ./PKHeX.Android/PKHeX.Android.csproj -f net10.0-android -c Release --no-restore

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find ./PKHeX.Android/bin/Release/net10.0-android -type f -name '*.apk' -print)
          if (( ${#apks[@]} == 0 )); then
            echo "No APK was produced." >&2
            exit 1
          fi
          printf 'APK: %s\n' "${apks[@]}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PKHeX-Android-APK
          path: ./PKHeX.Android/bin/Release/net10.0-android/**/*.apk
          if-no-files-found: error
          retention-days: 14
